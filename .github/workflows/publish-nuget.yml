name: Publish NuGet

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Publish NuGet
    uses: bigbang1112/workflows/.github/workflows/publish-nuget-immutable.yml@main
    permissions:
      contents: write # the workflow creates the GitHub release with the package assets
      packages: write
    with:
      dotnet-version: |
        10.0.x
        9.0.x
      project-path: Src/*/*.csproj
      test-path: Tests/*/*.csproj
      pack-path: |
        Src/Reuniverse.Razor/*.csproj
        Templates/*.csproj
      main-project: Reuniverse.Razor
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
