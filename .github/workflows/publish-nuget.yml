name: Publish NuGet

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Publish NuGet
    runs-on: ubuntu-latest

    permissions:
      contents: write # the action creates the GitHub release with the package assets
      packages: write
      id-token: write # NuGet.org trusted publishing
    
    concurrency:
      group: publish-nuget-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: bigbang1112/workflows/publish-nuget-immutable@main
        with:
          dotnet-version: |
            10.0.x
            9.0.x
          project-path: Src/*/*.csproj
          test-path: Tests/*/*.csproj
          pack-path: |
            Src/Reuniverse.Razor/*.csproj
            Templates/*.csproj
          nuget-user: ${{ vars.NUGET_USER }}
